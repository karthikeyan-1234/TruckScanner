<!--Mat dialog header-->
<div mat-dialog-header>
    <button class="close-button" mat-icon-button (click)="closeDialog()">
        <mat-icon>close</mat-icon>
    </button>
    <h2 mat-dialog-title>{{mode === 'edit' ? 'Edit Truck' : 'Add Truck'}}</h2>
</div>

<!--Mat dialog content-->
<div mat-dialog-content>
    <form [formGroup]="truckForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
            <mat-label>Truck Number</mat-label>
            <input matInput formControlName="registrationNo" required>
            <mat-error *ngIf="truckForm.get('registrationNo')!.hasError('required')">Truck number is required</mat-error>
        </mat-form-field>

    </form>
</div>

<!--Mat dialog footer-->
<div mat-dialog-actions>
    <button mat-button (click)="closeDialog()">Cancel</button>
    <button mat-button color="primary" (click)="onSubmit()" [disabled]="truckForm.invalid">Save</button>
</div>
